version: 2
updates:
  - package-ecosystem: docker
    directory: /
    allow:
      - dependency-name: nousresearch/hermes-agent
    # Consider new Hermes releases immediately when the scheduled check runs.
    cooldown:
      exclude:
        - nousresearch/hermes-agent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC

  - package-ecosystem: uv
    directory: /aio-python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    allow:
      - dependency-type: all
    groups:
      aio-python:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /aio-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      aio-npm:
        applies-to: version-updates
        patterns:
          - "*"
